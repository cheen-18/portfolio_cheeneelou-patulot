<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="50%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="bookGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="spellGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="50" cy="50" r="48" fill="url(#spellGlow)"/>

  <!-- Back Cover / Pages Depth -->
  <path d="M 22,24 L 78,16 L 86,76 L 30,84 Z" fill="#3b0764" opacity="0.8"/>
  <path d="M 24,25 L 77,18 L 83,74 L 30,81 Z" fill="#fef3c7"/>
  <!-- Page edge lines -->
  <line x1="83" y1="20" x2="87" y2="72" stroke="#d97706" stroke-width="0.8"/>
  <line x1="81" y1="22" x2="85" y2="74" stroke="#d97706" stroke-width="0.8"/>

  <!-- Main Front Cover -->
  <path d="M 16,22 L 72,14 L 80,74 L 24,82 Z" fill="url(#bookCover)" stroke="url(#bookGold)" stroke-width="1.8"/>

  <!-- Book Spine -->
  <path d="M 16,22 C 14,24 14,80 24,82 C 20,80 20,24 16,22 Z" fill="#1e1b4b" stroke="url(#bookGold)" stroke-width="1.2"/>

  <!-- Ornate Golden Corners -->
  <polygon points="17,23 30,21 18,34" fill="url(#bookGold)"/>
  <polygon points="71,15 58,17 70,28" fill="url(#bookGold)"/>
  <polygon points="79,73 66,75 78,62" fill="url(#bookGold)"/>
  <polygon points="25,81 38,79 26,68" fill="url(#bookGold)"/>

  <!-- Center Elven Crest / Emblem on Book Cover -->
  <circle cx="48" cy="48" r="14" fill="none" stroke="url(#bookGold)" stroke-width="1.5"/>
  <polygon points="48,37 51,45 59,48 51,51 48,59 45,51 37,48 45,45" fill="url(#bookGold)"/>
  <circle cx="48" cy="48" r="3" fill="#bef264"/>

  <!-- Floating Sparkles -->
  <circle cx="28" cy="16" r="2" fill="#fef08a"/>
  <circle cx="75" cy="85" r="2.5" fill="#c4b5fd"/>
</svg>
