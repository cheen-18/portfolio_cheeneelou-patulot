<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g stroke="url(#circleGrad)" stroke-width="1.5" fill="none" filter="url(#softGlow)">
    <!-- Outer concentric rings -->
    <circle cx="250" cy="250" r="230" stroke-width="2"/>
    <circle cx="250" cy="250" r="222" stroke-dasharray="4 8"/>
    <circle cx="250" cy="250" r="210" stroke-width="1.2"/>
    
    <!-- Runic ticks ring -->
    <circle cx="250" cy="250" r="185" stroke-dasharray="2 6" stroke-width="3"/>
    <circle cx="250" cy="250" r="175"/>

    <!-- Concentric inner rings -->
    <circle cx="250" cy="250" r="140" stroke-dasharray="12 6"/>
    <circle cx="250" cy="250" r="120" stroke-width="1.8"/>
    <circle cx="250" cy="250" r="70"/>
    <circle cx="250" cy="250" r="25" fill="#c4b5fd" fill-opacity="0.15"/>
    <circle cx="250" cy="250" r="8" fill="#fbbf24"/>

    <!-- Geometric Elven Star (Two interleaved squares / octagram) -->
    <polygon points="250,55 388,112 445,250 388,388 250,445 112,388 55,250 112,112" stroke="#ddd6fe" stroke-width="1.2"/>
    <polygon points="250,85 367,133 415,250 367,367 250,415 133,367 85,250 133,133" stroke="#fef08a" stroke-width="1" stroke-dasharray="6 4"/>

    <!-- Cardinal axis lines and cross markers -->
    <line x1="250" y1="20" x2="250" y2="480" stroke="#a78bfa" stroke-width="1" stroke-dasharray="8 6"/>
    <line x1="20" y1="250" x2="480" y2="250" stroke="#a78bfa" stroke-width="1" stroke-dasharray="8 6"/>
    <line x1="87" y1="87" x2="413" y2="413" stroke="#8b5cf6" stroke-width="0.8"/>
    <line x1="87" y1="413" x2="413" y2="87" stroke="#8b5cf6" stroke-width="0.8"/>

    <!-- Decorative elven glyph nodes -->
    <circle cx="250" cy="55" r="5" fill="#fde047"/>
    <circle cx="445" cy="250" r="5" fill="#fde047"/>
    <circle cx="250" cy="445" r="5" fill="#fde047"/>
    <circle cx="55" cy="250" r="5" fill="#fde047"/>

    <circle cx="388" cy="112" r="4" fill="#c4b5fd"/>
    <circle cx="388" cy="388" r="4" fill="#c4b5fd"/>
    <circle cx="112" cy="388" r="4" fill="#c4b5fd"/>
    <circle cx="112" cy="112" r="4" fill="#c4b5fd"/>
  </g>
</svg>
