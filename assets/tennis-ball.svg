<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="tennisBallGlow" cx="40%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f7fee7"/>
      <stop offset="25%" stop-color="#bef264"/>
      <stop offset="70%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#4d7c0f"/>
    </radialGradient>
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#65a30d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4d7c0f" stop-opacity="0"/>
    </radialGradient>
    <filter id="ballBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Aura Halo -->
  <circle cx="50" cy="50" r="46" fill="url(#haloGlow)"/>

  <!-- Ball body -->
  <circle cx="50" cy="50" r="36" fill="url(#tennisBallGlow)" filter="url(#ballBlur)"/>

  <!-- Seam Lines -->
  <path d="M 24,24 C 42,42 42,58 24,76" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.95"/>
  <path d="M 76,24 C 58,42 58,58 76,76" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.95"/>

  <!-- Highlight glimmer -->
  <circle cx="38" cy="36" r="6" fill="#ffffff" opacity="0.6"/>
</svg>
