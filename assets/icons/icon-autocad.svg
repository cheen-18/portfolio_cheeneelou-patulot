<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <filter id="cadGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="cadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="50%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <g stroke="url(#cadGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#cadGlow)">
    <!-- 2D Drafting Triangle Set-Square (30-60-90) -->
    <polygon points="10,54 54,54 10,14" fill="#c4b5fd" fill-opacity="0.12" stroke-width="2.2"/>
    <polygon points="18,48 42,48 18,28" stroke-width="1.8"/>

    <!-- Dimension Measurement Tick Marks -->
    <line x1="16" y1="54" x2="16" y2="50" stroke-width="1.4"/>
    <line x1="22" y1="54" x2="22" y2="51" stroke-width="1.4"/>
    <line x1="28" y1="54" x2="28" y2="50" stroke-width="1.4"/>
    <line x1="34" y1="54" x2="34" y2="51" stroke-width="1.4"/>
    <line x1="40" y1="54" x2="40" y2="50" stroke-width="1.4"/>
    <line x1="46" y1="54" x2="46" y2="51" stroke-width="1.4"/>

    <!-- Drafting Precision Divider / Compass Hinge Leg -->
    <circle cx="36" cy="14" r="3.5" fill="#ede9fe" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="36" y1="17" x2="26" y2="38" stroke-width="2.2"/>
    <line x1="36" y1="17" x2="48" y2="40" stroke-width="2.2"/>
    <!-- Compass Cross-Arc Adjustment -->
    <path d="M 30,30 Q 37,34 44,30" stroke="#fef08a" stroke-width="1.6"/>

    <!-- Subtle White Sparkle -->
    <circle cx="50" cy="16" r="1.3" fill="#ffffff" stroke="none"/>
  </g>
</svg>
