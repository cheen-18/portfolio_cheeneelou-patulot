<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <filter id="antennaGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="antennaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="50%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <g stroke="url(#antennaGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#antennaGlow)">
    <!-- Central Antenna Mast -->
    <line x1="32" y1="18" x2="32" y2="54" stroke-width="2.5"/>
    <!-- Triangular Mast Base Support -->
    <path d="M 22,54 L 32,38 L 42,54" stroke-width="2"/>
    <line x1="26" y1="48" x2="38" y2="48" stroke-width="1.8"/>

    <!-- Dipole Crossbar -->
    <line x1="24" y1="24" x2="40" y2="24" stroke-width="2.2"/>
    <circle cx="24" cy="24" r="1.5" fill="#ddd6fe"/>
    <circle cx="40" cy="24" r="1.5" fill="#ddd6fe"/>

    <!-- Antenna Tip Emitter Node with Gold/White Aura -->
    <circle cx="32" cy="18" r="3" fill="#ede9fe" stroke="#fbbf24" stroke-width="1.5"/>

    <!-- Radiating Electromagnetic Signal Waves (Left & Right) -->
    <!-- Inner Waves -->
    <path d="M 23,12 A 12,12 0 0,0 23,24" stroke-width="1.8"/>
    <path d="M 41,12 A 12,12 0 0,1 41,24" stroke-width="1.8"/>

    <!-- Outer Waves -->
    <path d="M 16,6 A 22,22 0 0,0 16,30" stroke-width="1.8" stroke-dasharray="2 1"/>
    <path d="M 48,6 A 22,22 0 0,1 48,30" stroke-width="1.8" stroke-dasharray="2 1"/>

    <!-- Outermost Distant Wave -->
    <path d="M 9,2 A 32,32 0 0,0 9,34" stroke-width="1.5" stroke-opacity="0.6"/>
    <path d="M 55,2 A 32,32 0 0,1 55,34" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- Subtle White Sparkle -->
    <circle cx="32" cy="8" r="1.2" fill="#ffffff" stroke="none"/>
  </g>
</svg>
