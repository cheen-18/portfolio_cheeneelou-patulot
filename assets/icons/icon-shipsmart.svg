<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <filter id="shipGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="shipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="50%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <g stroke="url(#shipGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#shipGlow)">
    <!-- Ship Hull (Cutting smoothly through water) -->
    <path d="M 12,42 L 18,52 L 46,52 L 54,38 L 10,38 Z" fill="#c4b5fd" fill-opacity="0.18" stroke-width="2.2"/>

    <!-- Water Waves under Hull -->
    <path d="M 6,56 Q 13,53 20,56 T 34,56 T 48,56 T 58,56" stroke-width="1.8"/>

    <!-- Shipping Containers stacked on deck -->
    <rect x="18" y="28" width="10" height="9" rx="1.5" stroke-width="1.6"/>
    <line x1="23" y1="28" x2="23" y2="37" stroke-width="1.2"/>
    
    <rect x="30" y="28" width="10" height="9" rx="1.5" stroke-width="1.6"/>
    <line x1="35" y1="28" x2="35" y2="37" stroke-width="1.2"/>

    <!-- Upper Cabin / Bridge Structure -->
    <path d="M 42,24 L 48,24 L 48,37 L 42,37 Z" stroke-width="1.8"/>
    <line x1="42" y1="28" x2="48" y2="28" stroke-width="1.2"/>

    <!-- Radar / Navigation Mast -->
    <line x1="45" y1="24" x2="45" y2="16" stroke-width="1.8"/>
    <line x1="42" y1="18" x2="48" y2="18" stroke-width="1.5"/>

    <!-- Smart Web App Network Node (Hovering GPS / Telemetry Ring) -->
    <g transform="translate(26, 8)">
      <circle cx="8" cy="8" r="7" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 2"/>
      <circle cx="8" cy="8" r="2.5" fill="#fef08a" stroke="none"/>
      <!-- Radiating smart tracking arcs -->
      <path d="M 1,4 A 9,9 0 0,1 15,4" stroke="#c4b5fd" stroke-width="1.2"/>
    </g>

    <!-- Subtle White Sparkle -->
    <circle cx="14" cy="24" r="1.2" fill="#ffffff" stroke="none"/>
  </g>
</svg>
