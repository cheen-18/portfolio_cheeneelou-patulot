<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <filter id="paleVioletGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="violetLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="50%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <g stroke="url(#violetLinear)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#paleVioletGlow)">
    <!-- Outer Power Supply Module Chassis -->
    <rect x="8" y="10" width="48" height="44" rx="8" stroke-width="2.2"/>
    
    <!-- Power Terminal Screws -->
    <circle cx="16" cy="18" r="2.5" fill="#ddd6fe"/>
    <circle cx="48" cy="18" r="2.5" fill="#ddd6fe"/>
    <circle cx="16" cy="46" r="2.5" fill="#ddd6fe"/>
    <circle cx="48" cy="46" r="2.5" fill="#ddd6fe"/>

    <!-- Central Lightning Energy / Voltage Conversion Symbol -->
    <path d="M 34,16 L 24,32 L 32,32 L 30,48 L 40,30 L 32,30 Z" fill="#c4b5fd" fill-opacity="0.25" stroke="#ede9fe" stroke-width="2"/>

    <!-- AC Sine Wave (~ Input) -->
    <path d="M 14,32 Q 17,28 20,32 T 26,32" stroke-width="1.8"/>

    <!-- DC Pure Level (= Output) -->
    <line x1="38" y1="30" x2="50" y2="30" stroke-width="2"/>
    <line x1="38" y1="35" x2="50" y2="35" stroke-dasharray="2 2" stroke-width="1.8"/>

    <!-- Subtle White/Gold Aura Sparkles -->
    <circle cx="44" cy="22" r="1.5" fill="#fef08a" stroke="none"/>
    <circle cx="20" cy="42" r="1.5" fill="#ffffff" stroke="none"/>
  </g>
</svg>
