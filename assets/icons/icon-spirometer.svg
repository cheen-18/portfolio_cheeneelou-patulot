<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <filter id="lungGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="lungGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ddd6fe"/>
      <stop offset="80%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="ballGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </radialGradient>
  </defs>

  <g stroke="url(#lungGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#lungGlow)">
    <!-- Trachea (Windpipe) -->
    <path d="M 30,8 L 30,19 M 34,8 L 34,19" stroke-width="2"/>
    <line x1="29" y1="11" x2="35" y2="11" stroke-width="1.4"/>
    <line x1="29" y1="15" x2="35" y2="15" stroke-width="1.4"/>

    <!-- Bronchial Bifurcation Branches -->
    <path d="M 30,19 C 28,23 24,25 21,27" stroke-width="1.8"/>
    <path d="M 34,19 C 36,23 40,25 43,27" stroke-width="1.8"/>

    <!-- Left Lung Lobe (Anatomical Lung Outline) -->
    <path d="M 28,21 C 23,20 16,23 13,29 C 10,35 10,44 14,50 C 18,55 24,53 26,49 C 27,47 28,38 28,21 Z" 
          fill="#c4b5fd" fill-opacity="0.16" stroke-width="2.2"/>
    <!-- Left Internal Bronchial Veins -->
    <path d="M 21,27 C 18,32 15,36 15,42" stroke-width="1.2" stroke-dasharray="2 1.5"/>
    <path d="M 20,33 C 23,37 24,42 24,45" stroke-width="1.2" stroke-dasharray="2 1.5"/>

    <!-- Right Lung Lobe (Anatomical Lung Outline) -->
    <path d="M 36,21 C 41,20 48,23 51,29 C 54,35 54,44 50,50 C 46,55 40,53 38,49 C 37,47 36,38 36,21 Z" 
          fill="#c4b5fd" fill-opacity="0.16" stroke-width="2.2"/>
    <!-- Right Internal Bronchial Veins -->
    <path d="M 43,27 C 46,32 49,36 49,42" stroke-width="1.2" stroke-dasharray="2 1.5"/>
    <path d="M 44,33 C 41,37 40,42 40,45" stroke-width="1.2" stroke-dasharray="2 1.5"/>

    <!-- 3-BALL SPIROMETER FLOW CHAMBERS (Center & Lower Core) -->
    <!-- Chamber 1 Base & Levitating Ball 1 (Lowest Elevation) -->
    <g transform="translate(0, 0)">
      <circle cx="25" cy="42" r="3.2" fill="url(#ballGlow)" stroke="#ffffff" stroke-width="1.2"/>
      <line x1="25" y1="46" x2="25" y2="48" stroke="#fef08a" stroke-width="1.2"/>
    </g>

    <!-- Chamber 2 Base & Levitating Ball 2 (Mid Elevation) -->
    <g transform="translate(0, 0)">
      <circle cx="32" cy="34" r="3.2" fill="url(#ballGlow)" stroke="#ffffff" stroke-width="1.2"/>
      <line x1="32" y1="38" x2="32" y2="44" stroke="#fef08a" stroke-width="1.2"/>
    </g>

    <!-- Chamber 3 Base & Levitating Ball 3 (High Elevation / Full Inspiration) -->
    <g transform="translate(0, 0)">
      <circle cx="39" cy="28" r="3.2" fill="url(#ballGlow)" stroke="#ffffff" stroke-width="1.2"/>
      <line x1="39" y1="32" x2="39" y2="42" stroke="#fef08a" stroke-width="1.2"/>
    </g>

    <!-- Flow Indicator Airflow Arc (Zero-G Air Inhalation) -->
    <path d="M 21,57 Q 32,61 43,57" stroke="#fbbf24" stroke-width="1.8"/>

    <!-- Subtle White/Gold Mana Sparkles -->
    <circle cx="32" cy="22" r="1.3" fill="#ffffff" stroke="none"/>
    <circle cx="12" cy="22" r="1.2" fill="#fef08a" stroke="none"/>
    <circle cx="52" cy="22" r="1.2" fill="#fef08a" stroke="none"/>
  </g>
</svg>
