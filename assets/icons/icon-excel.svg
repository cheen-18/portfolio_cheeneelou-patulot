<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <filter id="excelGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="excelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="50%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <g stroke="url(#excelGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#excelGlow)">
    <!-- Spreadsheet Grid Border -->
    <rect x="10" y="10" width="44" height="44" rx="6" stroke-width="2.2" fill="#c4b5fd" fill-opacity="0.12"/>

    <!-- Spreadsheet Column Header Row -->
    <line x1="10" y1="22" x2="54" y2="22" stroke-width="2"/>
    <line x1="10" y1="34" x2="54" y2="34" stroke-width="1.6"/>
    <line x1="10" y1="44" x2="54" y2="44" stroke-width="1.6"/>

    <!-- Spreadsheet Vertical Column Separators -->
    <line x1="24" y1="10" x2="24" y2="54" stroke-width="1.8"/>
    <line x1="39" y1="10" x2="39" y2="54" stroke-width="1.8"/>

    <!-- Header Cell Indicators -->
    <line x1="14" y1="16" x2="20" y2="16" stroke="#ffffff" stroke-width="2"/>
    <line x1="28" y1="16" x2="35" y2="16" stroke="#ffffff" stroke-width="2"/>
    <line x1="43" y1="16" x2="50" y2="16" stroke="#ffffff" stroke-width="2"/>

    <!-- Data Rows Formulations -->
    <line x1="14" y1="28" x2="20" y2="28" stroke-width="1.4"/>
    <line x1="28" y1="28" x2="35" y2="28" stroke-width="1.4"/>
    
    <!-- Calculation Summation / Excel Function Sigma (Σ) Symbol -->
    <path d="M 49,26 L 43,26 L 46,30 L 43,34 L 49,34" stroke="#fef08a" stroke-width="1.8"/>

    <!-- Verified Audit Check Badge (Bottom Right Floating) -->
    <circle cx="48" cy="48" r="7.5" fill="#1e1038" stroke="#fef08a" stroke-width="1.8"/>
    <path d="M 44.5,48 L 47,50.5 L 51.5,45.5" stroke="#a3e635" stroke-width="2"/>
  </g>
</svg>
