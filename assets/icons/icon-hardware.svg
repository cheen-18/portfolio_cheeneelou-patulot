<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <filter id="hwGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="hwGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="50%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <g stroke="url(#hwGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#hwGlow)">
    <!-- Central Microcontroller IC Package Body -->
    <rect x="18" y="18" width="28" height="28" rx="5" fill="#c4b5fd" fill-opacity="0.15" stroke-width="2.2"/>
    <circle cx="23" cy="23" r="1.5" fill="#fef08a" stroke="none"/>

    <!-- Microcontroller Core Silicon Circuit Grid -->
    <rect x="25" y="25" width="14" height="14" rx="2" stroke-width="1.5" stroke-dasharray="3 2"/>
    <circle cx="32" cy="32" r="2" fill="#ede9fe" stroke="none"/>

    <!-- Left IC Pins -->
    <line x1="8" y1="24" x2="18" y2="24" stroke-width="1.8"/>
    <line x1="8" y1="32" x2="18" y2="32" stroke-width="1.8"/>
    <line x1="8" y1="40" x2="18" y2="40" stroke-width="1.8"/>

    <!-- Right IC Pins -->
    <line x1="46" y1="24" x2="56" y2="24" stroke-width="1.8"/>
    <line x1="46" y1="32" x2="56" y2="32" stroke-width="1.8"/>
    <line x1="46" y1="40" x2="56" y2="40" stroke-width="1.8"/>

    <!-- Top IC Pins -->
    <line x1="24" y1="8" x2="24" y2="18" stroke-width="1.8"/>
    <line x1="32" y1="8" x2="32" y2="18" stroke-width="1.8"/>
    <line x1="40" y1="8" x2="40" y2="18" stroke-width="1.8"/>

    <!-- Bottom IC Pins -->
    <line x1="24" y1="46" x2="24" y2="56" stroke-width="1.8"/>
    <line x1="32" y1="46" x2="32" y2="56" stroke-width="1.8"/>
    <line x1="40" y1="46" x2="40" y2="56" stroke-width="1.8"/>

    <!-- Surrounding PCB Traces with Micro-Vias -->
    <circle cx="12" cy="14" r="1.5" fill="#ddd6fe"/>
    <path d="M 12,14 L 12,18 L 18,18" stroke-width="1.2"/>

    <circle cx="52" cy="50" r="1.5" fill="#fef08a"/>
    <path d="M 52,50 L 52,46 L 46,46" stroke-width="1.2"/>
  </g>
</svg>
