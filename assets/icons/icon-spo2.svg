<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <filter id="spo2Glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="spo2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="50%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <g stroke="url(#spo2Grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#spo2Glow)">
    <!-- Stylized Heart Framework with Translucent Lavender Fill -->
    <path d="M 32,54 C 20,44 10,34 10,22 C 10,14 16,9 23,9 C 27,9 30.5,11.5 32,14 C 33.5,11.5 37,9 41,9 C 48,9 54,14 54,22 C 54,34 44,44 32,54 Z" 
          fill="#c4b5fd" fill-opacity="0.12" stroke-width="2.2"/>

    <!-- High-Precision ECG / PPG Pulse Wave running across the heart -->
    <path d="M 12,28 L 22,28 L 25,23 L 29,35 L 34,16 L 38,32 L 41,26 L 44,28 L 52,28" 
          stroke="#ffffff" stroke-width="2.2"/>

    <!-- Optical Sensor LED Emitter Ray at Apex -->
    <circle cx="32" cy="14" r="2" fill="#fbbf24" stroke="none"/>
    <line x1="32" y1="17" x2="32" y2="22" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="1 1"/>

    <!-- Oxygen Molecule O2 Badge in Pale Violet -->
    <g transform="translate(38, 42)">
      <circle cx="6" cy="4" r="4.5" stroke="#ede9fe" stroke-width="1.5"/>
      <!-- Subscript 2 -->
      <path d="M 13,7 C 13,5.5 15,5.5 15,7 C 15,8 13,9 13,9 L 16,9" stroke="#ede9fe" stroke-width="1.2"/>
    </g>

    <!-- Subtle White Sparkles -->
    <circle cx="16" cy="18" r="1.2" fill="#ffffff" stroke="none"/>
    <circle cx="48" cy="18" r="1.2" fill="#ffffff" stroke="none"/>
  </g>
</svg>
